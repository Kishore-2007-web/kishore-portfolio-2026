<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kishore — Developer & Creative Technologist</title>
    <meta
      name="description"
      content="Kishore is a developer building useful digital experiences across web, software, AI, game development and 3D."
    />
    <meta name="theme-color" content="#000000" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kishore — Developer & Creative Technologist" />
    <meta property="og:description" content="Kishore is a developer building useful digital experiences across web, software, AI, game development and 3D." />
    <meta property="og:site_name" content="Kishore Digital Lab" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #000000;
        --text: #ffffff;
      }
      :root[data-theme="white"] {
        --bg: #ffffff;
        --text: #000000;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        background-color: var(--bg);
      }
    </style>
    <script>
      (function() {
        try {
          var current = localStorage.getItem('portfolio-theme-mode');
          // Start with black if null, then alternate
          var nextTheme = current === 'white' ? 'black' : (current === 'black' ? 'white' : 'black');
          localStorage.setItem('portfolio-theme-mode', nextTheme);
          document.documentElement.setAttribute('data-theme', nextTheme);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
